
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OnDaMap — Explore the World</title>

  <!-- Supabase, Three.js and Globe.gl -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #010204;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* OnDaMap Interface */

    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: calc(100% - 40px);
      max-width: 408px;
      background: rgba(4, 8, 12, 0.88);
      backdrop-filter: blur(12px);
      padding: 22px;
      border-radius: 15px;
      border: 1px solid #38bdf8;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.25),
        0 0 12px rgba(16, 185, 129, 0.15);
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 28px;
      background: linear-gradient(90deg, #38bdf8, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .sub {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      background: #070d14;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #0284c7, #10b981);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .auth-bar {
      margin-top: 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
    }

    .auth-bar button {
      padding: 5px 10px;
      font-size: 11px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    .auth-bar button:hover {
      background: #38bdf8;
      color: #000;
    }

    /* Preview Modal */

    #modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      background: #050a0f;
      border: 1px solid #38bdf8;
      border-radius: 14px;
      z-index: 100;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
    }

    #modal iframe {
      width: 100%;
      height: 315px;
      border-radius: 8px;
      border: none;
      margin-top: 12px;
    }

    .close-btn {
      float: right;
      background: transparent;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    @media (max-width: 500px) {
      .ui-overlay {
        top: 12px;
        left: 12px;
        width: calc(100% - 24px);
        padding: 16px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div id="globeViz"></div>

  <div class="ui-overlay">

    <h1>OnDaMap</h1>

    <div class="sub">
      Magical 3D globe of internet shares.
      Guests get 1 free post; sign in for up to 10!
    </div>

    <form id="linkForm">

      <input
        type="text"
        id="title"
        placeholder="Link title"
        required
      />

      <input
        type="url"
        id="url"
        placeholder="https://youtube.com/... or any URL"
        required
      />

      <button type="submit">
        Post to Globe
      </button>

    </form>

    <div class="auth-bar" id="authSection">
      <span id="userStatus">Not signed in</span>
      <button id="authBtn" onclick="toggleAuth()">
        Sign In / Up
      </button>
    </div>

  </div>

  <!-- Preview Modal -->

  <div id="modal">

    <button class="close-btn" onclick="closeModal()">✕</button>

    <h2
      id="modalTitle"
      style="margin:0 0 8px 0; font-size:18px; color:#38bdf8;"
    ></h2>

    <div id="modalContent"></div>

    <a
      id="modalLink"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:inline-block; margin-top:12px; color:#10b981; text-decoration:none; font-weight:600;"
    >
      Open Full Link ↗
    </a>

  </div>

  <script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
      'https://nhylzscggsmtuiqvmijs.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_Nwlnp52KKsSR7hzkWLHEoQ_qrjKPfo8';

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    let globe;
    let currentUser = null;

    let cloudsMesh = null;
    let starField = null;

    let twinkleStars = [];
    let galaxySprites = [];

    let shootingStar = null;
    let shootingStarLine = null;

    let shootingActive = false;
    let shootingElapsed = 0;
    let shootingCooldown = 4;

    let shootingVelocity = new THREE.Vector3();

    let oceanWaveUniform = null;

    // ==========================================
    // INITIALIZATION
    // ==========================================

    async function init() {

      const {
        data: { session }
      } = await db.auth.getSession();

      updateAuthUI(session);

      db.auth.onAuthStateChange((event, session) => {
        updateAuthUI(session);
      });

      await setupGlobe();

      await loadGlobeLinks();

    }

    // ==========================================
    // AUTHENTICATION
    // ==========================================

    function updateAuthUI(session) {

      currentUser = session?.user || null;

      const status =
        document.getElementById('userStatus');

      const btn =
        document.getElementById('authBtn');

      if (currentUser) {

        status.innerText =
          currentUser.email?.split('@')[0] || 'Signed In';

        btn.innerText = 'Sign Out';

      } else {

        status.innerText = 'Guest Mode';

        btn.innerText = 'Sign In';

      }

    }

    async function toggleAuth() {

      if (currentUser) {

        await db.auth.signOut();

      } else {

        const email = prompt(
          'Enter email for login/signup:'
        );

        if (!email) return;

        const password = prompt(
          'Enter password:'
        );

        if (!password) return;

        const { error } =
          await db.auth.signInWithPassword({
            email,
            password
          });

        if (error) {

          const { error: signUpError } =
            await db.auth.signUp({
              email,
              password
            });

          if (signUpError) {

            alert(signUpError.message);

          } else {

            alert(
              'Account created! Check your email if confirmation is required.'
            );

          }

        }

      }

    }

    // ==========================================
    // COSMIC BACKGROUND
    // ==========================================

    function addCosmicGalaxyAndSun(scene) {

      // COLORFUL STARFIELD

      const starCount = 10000;

      const geometry =
        new THREE.BufferGeometry();

      const positions =
        new Float32Array(starCount * 3);

      const colors =
        new Float32Array(starCount * 3);

      const palette = [
        '#ffffff',
        '#b9dcff',
        '#a78bfa',
        '#f0abfc',
        '#67e8f9',
        '#fde047'
      ].map(c => new THREE.Color(c));

      for (let i = 0; i < starCount; i++) {

        const r = 900 + Math.random() * 1600;

        const theta =
          Math.random() * Math.PI * 2;

        const phi =
          Math.acos(2 * Math.random() - 1);

        positions[i * 3] =
          r * Math.sin(phi) * Math.cos(theta);

        positions[i * 3 + 1] =
          r * Math.sin(phi) * Math.sin(theta);

        positions[i * 3 + 2] =
          r * Math.cos(phi);

        const color =
          palette[
            Math.floor(Math.random() * palette.length)
          ];

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;

      }

      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

      geometry.setAttribute(
        'color',
        new THREE.BufferAttribute(colors, 3)
      );

      const material =
        new THREE.PointsMaterial({

          size: 1.5,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.95

        });

      starField =
        new THREE.Points(geometry, material);

      scene.add(starField);


      // INDIVIDUALLY TWINKLING STARS

      for (let i = 0; i < 120; i++) {

        const starMaterial =
          new THREE.SpriteMaterial({

            color: palette[
              Math.floor(Math.random() * palette.length)
            ],

            transparent: true,
            opacity: 0.8,

            blending: THREE.AdditiveBlending

          });

        const star =
          new THREE.Sprite(starMaterial);

        const angle =
          Math.random() * Math.PI * 2;

        const distance =
          850 + Math.random() * 650;

        star.position.set(

          Math.cos(angle) * distance,

          (Math.random() - 0.5) * 1400,

          Math.sin(angle) * distance

        );

        const size =
          1.5 + Math.random() * 3;

        star.scale.set(size, size, 1);

        star.userData.phase =
          Math.random() * Math.PI * 2;

        star.userData.speed =
          0.5 + Math.random() * 2;

        star.userData.baseOpacity =
          0.7 + Math.random() * 0.3;

        scene.add(star);

        twinkleStars.push(star);

      }


      // COLORFUL NEBULA TEXTURE

      const canvas =
        document.createElement('canvas');

      canvas.width = 512;
      canvas.height = 512;

      const ctx =
        canvas.getContext('2d');

      const gradient =
        ctx.createRadialGradient(
          256, 256, 5,
          256, 256, 250
        );

      gradient.addColorStop(
        0,
        'rgba(90,120,255,0.45)'
      );

      gradient.addColorStop(
        0.3,
        'rgba(180,70,255,0.25)'
      );

      gradient.addColorStop(
        0.6,
        'rgba(40,180,220,0.12)'
      );

      gradient.addColorStop(
        1,
        'rgba(0,0,0,0)'
      );

      ctx.fillStyle = gradient;

      ctx.fillRect(0, 0, 512, 512);

      const nebulaTexture =
        new THREE.CanvasTexture(canvas);

      const galaxyColors = [
        0x8877ff,
        0x38bdf8,
        0xe879f9,
        0x22d3ee,
        0x818cf8
      ];

      // Place colorful nebulae around the scene

      for (let i = 0; i < 14; i++) {

        const galaxy =
          new THREE.Sprite(
            new THREE.SpriteMaterial({

              map: nebulaTexture,

              color:
                galaxyColors[
                  i % galaxyColors.length
                ],

              transparent: true,
              opacity: 0.28,

              blending:
                THREE.AdditiveBlending,

              depthWrite: false

            })
          );

        const angle =
          Math.random() * Math.PI * 2;

        const distance =
          1250 + Math.random() * 450;

        galaxy.position.set(

          Math.cos(angle) * distance,

          (Math.random() - 0.5) * 1100,

          Math.sin(angle) * distance

        );

        const size =
          350 + Math.random() * 350;

        galaxy.scale.set(
          size,
          size * 0.65,
          1
        );

        galaxy.userData.baseOpacity = 0.28;

        scene.add(galaxy);

        galaxySprites.push(galaxy);

      }


      // SHOOTING STAR

      shootingStar =
        new THREE.Group();

      const shootingHead =
        new THREE.Mesh(

          new THREE.SphereGeometry(2, 8, 8),

          new THREE.MeshBasicMaterial({
            color: 0xffffff
          })

        );

      shootingStar.add(shootingHead);

      const trailGeometry =
        new THREE.BufferGeometry().setFromPoints([

          new THREE.Vector3(0, 0, 0),

          new THREE.Vector3(-110, 0, 0)

        ]);

      shootingStarLine =
        new THREE.Line(

          trailGeometry,

          new THREE.LineBasicMaterial({

            color: 0x9edfff,

            transparent: true,

            opacity: 0.9,

            blending: THREE.AdditiveBlending

          })

        );

      shootingStar.add(shootingStarLine);

      shootingStar.visible = false;

      scene.add(shootingStar);


      // LIGHTING

      const sunLight =
        new THREE.DirectionalLight(
          0xfff5e6,
          2.0
        );

      sunLight.position.set(
        400, 200, 400
      );

      scene.add(sunLight);

      const ambientLight =
        new THREE.AmbientLight(
          0x334155,
          1.15
        );

      scene.add(ambientLight);

    }

    // ==========================================
    // SHOOTING STAR ANIMATION
    // ==========================================

    function startShootingStar() {

      const angle =
        Math.random() * Math.PI * 2;

      shootingStar.position.set(

        Math.cos(angle) * 1150,

        (Math.random() - 0.5) * 900,

        Math.sin(angle) * 1150

      );

      shootingVelocity.set(

        -Math.cos(angle) * 180,

        -80 - Math.random() * 100,

        -Math.sin(angle) * 180

      );

      shootingStar.quaternion.setFromUnitVectors(

        new THREE.Vector3(1, 0, 0),

        shootingVelocity.clone().normalize()

      );

      shootingStar.visible = true;

      shootingElapsed = 0;

      shootingActive = true;

    }

    // ==========================================
    // ANIMATION LOOP
    // ==========================================

    let previousFrameTime = 0;

    function animateScene(timestamp) {

      requestAnimationFrame(animateScene);

      const delta = Math.min(
        (timestamp - previousFrameTime) / 1000 || 0,
        0.05
      );

      previousFrameTime = timestamp;

      const time = timestamp * 0.001;


      // Animate clouds

      if (cloudsMesh) {

        cloudsMesh.rotation.y +=
          0.00012;

      }


      // Animate ocean waves

      if (oceanWaveUniform) {

        oceanWaveUniform.value = time;

      }


      // Twinkling stars

      twinkleStars.forEach(star => {

        const phase =
          star.userData.phase;

        const speed =
          star.userData.speed;

        const opacity =
          star.userData.baseOpacity *
          (0.35 + 0.65 *
            (0.5 + 0.5 *
              Math.sin(time * speed + phase)
            )
          );

        star.material.opacity = opacity;

      });


      // Slowly pulsating galaxies

      galaxySprites.forEach((galaxy, i) => {

        galaxy.material.opacity =
          galaxy.userData.baseOpacity *
          (0.8 + 0.2 *
            Math.sin(time * 0.35 + i)
          );

      });


      // Shooting stars

      if (!shootingActive) {

        shootingCooldown -= delta;

        if (shootingCooldown <= 0) {

          startShootingStar();

        }

      } else {

        shootingElapsed += delta;

        shootingStar.position.addScaledVector(
          shootingVelocity,
          delta
        );

        const fade =
          Math.max(
            0,
            1 - shootingElapsed / 1.2
          );

        shootingStarLine.material.opacity =
          fade * 0.9;

        shootingStar.children[0].material.opacity =
          fade;

        if (shootingElapsed > 1.2) {

          shootingStar.visible = false;

          shootingActive = false;

          shootingCooldown =
            4 + Math.random() * 9;

        }

      }

    }

    // ==========================================
    // OCEAN WAVE SHADER
    // ==========================================

    function addOceanWaves() {

      const material =
        globe.globeMaterial();

      material.onBeforeCompile = shader => {

        shader.uniforms.uWaveTime = {
          value: 0
        };

        oceanWaveUniform =
          shader.uniforms.uWaveTime;

        shader.fragmentShader =
          shader.fragmentShader.replace(

            '#include <common>',

            `#include <common>
             uniform float uWaveTime;`

          );

        shader.fragmentShader =
          shader.fragmentShader.replace(

            '#include <map_fragment>',

            `#include <map_fragment>

            // Identify blue ocean pixels
            float oceanMask =
              smoothstep(
                0.015,
                0.12,
                diffuseColor.b - diffuseColor.r * 1.05
              ) *
              smoothstep(
                0.01,
                0.08,
                diffuseColor.b - diffuseColor.g * 0.92
              );

            // Two moving wave patterns
            float waveA = sin(
              vMapUv.x * 190.0 +
              vMapUv.y * 75.0 +
              uWaveTime * 1.8
            );

            float waveB = sin(
              vMapUv.x * 115.0 -
              vMapUv.y * 130.0 -
              uWaveTime * 1.25
            );

            float wavePattern =
              (waveA + waveB) * 0.5;

            // Subtle moving ocean reflections
            diffuseColor.rgb +=
              vec3(0.025, 0.065, 0.11) *
              wavePattern *
              oceanMask;

            `

          );

      };

      material.needsUpdate = true;

    }

    // ==========================================
    // SET UP THE 3D EARTH
    // ==========================================

    async function setupGlobe() {

      const rendererConfig = {

        antialias: true,

        alpha: false,

        powerPreference: 'high-performance'

      };

      globe = Globe({
        rendererConfig
      })(
        document.getElementById('globeViz')
      )

        // 8K EARTH TEXTURE

        .globeImageUrl(
          'https://www.solarsystemscope.com/textures/download/8k_earth_daymap.jpg'
        )

        // TOPOGRAPHY

        .bumpImageUrl(
          'https://unpkg.com/three-globe/example/img/earth-topology.png'
        )

        .backgroundColor('#010204')

        .atmosphereColor('#38bdf8')

        .atmosphereAltitude(0.3)

        .htmlElementsData([])

        .htmlElement(d => {

          const el =
            document.createElement('div');

          const size =
            Math.max(10, (d.votes || 1) * 2.2);

          el.innerHTML = `
            <div style="
              cursor:pointer;
              background:radial-gradient(circle,#38bdf8,#10b981);
              width:${size}px;
              height:${size}px;
              border-radius:50%;
              box-shadow:0 0 16px #38bdf8,0 0 26px #10b981;
              border:2px solid #fff;
            "></div>
          `;

          el.onclick = () => openPreview(d);

          return el;

        });


      // HIGH QUALITY RENDERING

      const renderer = globe.renderer();

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      const maxAnisotropy =
        renderer.capabilities.getMaxAnisotropy();


      // Wait for the Earth texture to load before
      // applying additional texture filtering.

      globe.onGlobeReady(() => {

        const earthMaterial =
          globe.globeMaterial();

        if (earthMaterial.map) {

          earthMaterial.map.anisotropy =
            maxAnisotropy;

          earthMaterial.map.minFilter =
            THREE.LinearMipmapLinearFilter;

          earthMaterial.map.magFilter =
            THREE.LinearFilter;

          earthMaterial.map.generateMipmaps =
            true;

          earthMaterial.map.needsUpdate = true;

        }

      });


      // EARTH MATERIAL

      globe.globeMaterial().bumpScale = 12;

      globe.globeMaterial().shininess = 28;


      // OCEAN ANIMATION

      addOceanWaves();


      // ROTATION AND ZOOM

      globe.controls().autoRotate = true;

      globe.controls().autoRotateSpeed = 0.4;

      globe.controls().minDistance = 110;

      globe.controls().maxDistance = 700;

      globe.controls().enableDamping = true;

      globe.controls().dampingFactor = 0.06;


      // COSMIC BACKGROUND

      addCosmicGalaxyAndSun(
        globe.scene()
      );


      // FLOATING CLOUD LAYER

      const cloudTextureUrl =
        'https://unpkg.com/three-globe/example/img/earth-clouds.png';

      new THREE.TextureLoader().load(

        cloudTextureUrl,

        cloudTex => {

          cloudTex.anisotropy =
            maxAnisotropy;

          const cloudsGeo =
            new THREE.SphereGeometry(
              globe.getGlobeRadius() + 1.5,
              100,
              100
            );

          const cloudsMat =
            new THREE.MeshPhongMaterial({

              map: cloudTex,

              transparent: true,

              opacity: 0.23,

              depthWrite: false

            });

          cloudsMesh =
            new THREE.Mesh(
              cloudsGeo,
              cloudsMat
            );

          globe.scene().add(cloudsMesh);

        },

        undefined,

        error => {
          console.warn(
            'Cloud texture could not load:',
            error
          );
        }

      );


      // START ANIMATIONS

      requestAnimationFrame(animateScene);

    }

    // ==========================================
    // LOAD LINKS FROM SUPABASE
    // ==========================================

    async function loadGlobeLinks() {

      const { data, error } =
        await db
          .from('links')
          .select('*');

      if (error) {

        console.error(
          'Could not load links:',
          error
        );

        return;

      }

      if (!data || !globe) return;

      globe.htmlElementsData(data);

    }

    // ==========================================
    // POST LINKS TO THE GLOBE
    // ==========================================

    document
      .getElementById('linkForm')
      .addEventListener('submit', async (e) => {

        e.preventDefault();

        const title =
          document.getElementById('title').value;

        const url =
          document.getElementById('url').value;


        // ACCOUNT POST LIMIT

        if (currentUser) {

          const { count, error: countError } =
            await db
              .from('links')
              .select('*', {
                count: 'exact',
                head: true
              })
              .eq('user_id', currentUser.id);

          if (countError) {

            alert(countError.message);

            return;

          }

          if (count >= 10) {

            alert(
              'You have reached the limit of 10 posted links per account!'
            );

            return;

          }

        } else {

          if (
            localStorage.getItem('guest_posted')
          ) {

            alert(
              'Guests can make 1 free post! Please Sign In/Up to post more links.'
            );

            return;

          }

        }


        // RANDOM GLOBE LOCATION

        const lat =
          (Math.random() * 140) - 70;

        const lng =
          (Math.random() * 360) - 180;


        // INSERT INTO SUPABASE

        const { error } =
          await db
            .from('links')
            .insert([{

              title,
              url,
              lat,
              lng,

              votes: 1,

              user_id:
                currentUser
                  ? currentUser.id
                  : null

            }]);


        if (error) {

          alert(
            'Error posting link: ' + error.message
          );

        } else {

          if (!currentUser) {

            localStorage.setItem(
              'guest_posted',
              'true'
            );

            alert(
              'Guest post successful! Sign in anytime to unlock up to 10 posts.'
            );

          } else {

            alert(
              'Successfully pinned to the globe!'
            );

          }

          e.target.reset();

          await loadGlobeLinks();

        }

      });

    // ==========================================
    // LINK PREVIEW
    // ==========================================

    function openPreview(item) {

      document.getElementById(
        'modalTitle'
      ).innerText = item.title;

      const modalLink =
        document.getElementById('modalLink');

      modalLink.href = item.url;

      const content =
        document.getElementById('modalContent');

      content.innerHTML = '';


      // YOUTUBE PREVIEW

      if (
        item.url.includes('youtube.com') ||
        item.url.includes('youtu.be')
      ) {

        let videoId = null;

        try {

          const parsedUrl =
            new URL(item.url);

          if (
            parsedUrl.hostname.includes('youtu.be')
          ) {

            videoId =
              parsedUrl.pathname.split('/').filter(Boolean)[0];

          } else {

            videoId =
              parsedUrl.searchParams.get('v');

          }

        } catch (error) {

          console.error(error);

        }

        if (videoId) {

          const iframe =
            document.createElement('iframe');

          iframe.src =
            'https://www.youtube.com/embed/' +
            encodeURIComponent(videoId);

          iframe.allowFullscreen = true;

          iframe.allow =
            'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';

          content.appendChild(iframe);

        }

      }

      // SPOTIFY PREVIEW

      else if (
        item.url.includes('spotify.com')
      ) {

        const iframe =
          document.createElement('iframe');

        iframe.src =
          item.url.replace(
            'open.spotify.com',
            'open.spotify.com/embed'
          );

        iframe.height = 152;

        iframe.allow =
          'encrypted-media';

        content.appendChild(iframe);

      }

      // OTHER WEBSITES

      else {

        const message =
          document.createElement('p');

        message.style.color = '#94a3b8';

        message.innerText =
          'Direct preview not available for this website. Click below to view!';

        content.appendChild(message);

      }

      document.getElementById(
        'modal'
      ).style.display = 'block';

    }

    // ==========================================
    // CLOSE PREVIEW
    // ==========================================

    function closeModal() {

      document.getElementById(
        'modal'
      ).style.display = 'none';

      document.getElementById(
        'modalContent'
      ).innerHTML = '';

    }

    // ==========================================
    // START WEBSITE
    // ==========================================

    init().catch(error => {

      console.error(
        'Website initialization failed:',
        error
      );

    });

  </script>

</body>
</html>
