<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>OnDaMap — 3D Globe Billboards</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #010204;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #webgl, #css3d { position: fixed; inset: 0; }
    #webgl { z-index: 0; }
    #css3d { z-index: 1; pointer-events: none; }
    #css3d div { pointer-events: none; }
    #css3d .bb-media,
    #css3d .bb-like,
    #css3d .bb-open { pointer-events: auto; }

    .hidden { display: none !important; }

    /* ---------- SMALL TOP BAR (doesn't cover the map) ---------- */
    #topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 5px 5px 14px;
      background: rgba(4, 8, 14, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.18);
    }

    .brand {
      font-weight: 900;
      font-size: 16px;
      margin-right: 4px;
      background: linear-gradient(90deg, #38bdf8, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    button { font-family: inherit; cursor: pointer; }

    .pill {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: #7dd3fc;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .primary {
      border: none;
      background: linear-gradient(90deg, #0284c7, #10b981);
      color: #fff;
    }

    .pill:hover, .primary:hover { filter: brightness(1.12); }

    .panel {
      position: fixed;
      top: 60px;
      left: 12px;
      z-index: 20;
      width: min(320px, calc(100vw - 24px));
      padding: 14px;
      background: rgba(4, 8, 14, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 14px;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.18);
      font-size: 13px;
    }

    .panel form { display: flex; flex-direction: column; gap: 8px; }

    .panel input {
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      background: #070d14;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .panel input:focus { border-color: #38bdf8; }

    .panel button[type=submit], .panel .btn {
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .panel .btn {
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #7dd3fc;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    .hint { color: #94a3b8; font-size: 12px; line-height: 1.45; margin-top: 6px; }
    .hint.ok { color: #34d399; }
    .hint.bad { color: #f87171; }

    details { margin-top: 8px; color: #94a3b8; font-size: 12px; }
    summary { cursor: pointer; color: #7dd3fc; }
    #siteList { margin-top: 6px; line-height: 1.6; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      z-index: 30;
      padding: 10px 16px;
      background: rgba(4, 8, 14, 0.92);
      border: 1px solid #38bdf8;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      max-width: calc(100vw - 30px);
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #soundHint {
      position: fixed;
      right: 12px;
      top: 14px;
      z-index: 19;
      padding: 7px 12px;
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(4, 8, 14, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 999px;
      pointer-events: none;
    }

    @media (max-width: 560px) {
      #soundHint { top: auto; bottom: 70px; right: 50%; transform: translateX(50%); }
    }

    /* ---------- BILLBOARDS (these live in 3D space) ---------- */
    .bb {
      --c: #22d3ee;
      --pc: #22d3ee;
      width: 560px;
      height: 420px;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(180deg, rgba(8, 16, 28, 0.96), rgba(3, 7, 14, 0.96));
      border: 3px solid var(--c);
      box-shadow:
        0 0 16px var(--c),
        0 0 60px color-mix(in srgb, var(--c) 55%, transparent),
        inset 0 0 24px color-mix(in srgb, var(--c) 35%, transparent);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .bb.tall { width: 380px; height: 700px; }

    .bb.playing { animation: bbPulse 1.6s ease-in-out infinite; }

    @keyframes bbPulse {
      0%, 100% { box-shadow: 0 0 16px var(--c), 0 0 60px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 24px color-mix(in srgb, var(--c) 35%, transparent); }
      50% { box-shadow: 0 0 30px var(--c), 0 0 110px var(--c), inset 0 0 34px color-mix(in srgb, var(--c) 55%, transparent); }
    }

    .bb-head { display: flex; align-items: center; gap: 10px; height: 40px; flex: none; }

    .bb-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--pc);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
      white-space: nowrap;
    }

    .bb-title {
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 10px var(--c);
    }

    .bb-media {
      flex: 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .bb-media iframe { width: 100%; height: 100%; border: 0; display: block; }

    .bb-foot { display: flex; align-items: center; gap: 12px; height: 50px; padding-top: 8px; flex: none; }

    .bb-like {
      font-size: 19px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 999px;
      border: 2px solid var(--c);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    .bb-like.liked { background: var(--c); color: #02121a; }

    .bb-status { flex: 1; font-size: 14px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bb-open { font-size: 16px; font-weight: 800; color: var(--c); text-decoration: none; white-space: nowrap; }

    .pv {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--pc) 55%, #000), #05070d 75%);
    }
    .pv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .85; }
    .pv > div { position: relative; }
    .pv .play {
      width: 86px; height: 86px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 34px;
      background: rgba(0, 0, 0, .55);
      border: 3px solid #fff;
      box-shadow: 0 0 30px var(--c);
    }
    .pv .icon { font-size: 64px; }
    .pv .pname { font-size: 26px; font-weight: 900; }
    .pv .ptitle { font-size: 18px; color: #cbd5e1; max-width: 90%; }
    .pv .tip { font-size: 14px; color: #cbd5e1; background: rgba(0,0,0,.5); padding: 5px 12px; border-radius: 999px; }

    /* ---------- GLOWING RETICLE (where your post lands) ---------- */
    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 5;
      pointer-events: none;
      transition: opacity .3s;
    }
    #reticle.dim { opacity: .45; }
    #reticle.dim .label { display: none; }
    #reticle .fx { position: absolute; left: 0; top: 0; animation: retHue 5s linear infinite; }
    #reticle .aura {
      position: absolute;
      left: -40px; top: -40px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: conic-gradient(#38bdf8, #a855f7, #f472b6, #facc15, #34d399, #38bdf8);
      filter: blur(12px);
      opacity: .6;
      animation: retSpin 3s linear infinite;
    }
    #reticle .ring {
      position: absolute;
      left: -24px; top: -24px;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .85);
      box-shadow: 0 0 12px #38bdf8, inset 0 0 12px #38bdf8;
      animation: retRing 2s ease-out infinite;
    }
    #reticle .flares { position: absolute; left: 0; top: 0; animation: retSpin 9s linear infinite; }
    #reticle .flares i {
      position: absolute;
      left: -75px; top: -1px;
      width: 150px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
    }
    #reticle .flares i:last-child { transform: rotate(90deg); }
    #reticle .core {
      position: absolute;
      left: -7px; top: -7px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px 4px #38bdf8, 0 0 28px 10px #a855f7, 0 0 60px 20px rgba(56, 189, 248, .45);
      animation: retPulse 1.4s ease-in-out infinite;
    }
    #reticle .label {
      position: absolute;
      top: 46px;
      left: 0;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      padding: 4px 10px;
      background: rgba(4, 8, 14, .78);
      border: 1px solid rgba(56, 189, 248, .5);
      border-radius: 999px;
      color: #e2e8f0;
    }
    @keyframes retHue { to { filter: hue-rotate(360deg); } }
    @keyframes retSpin { to { transform: rotate(360deg); } }
    @keyframes retPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes retRing { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

    /* ---------- IN-SITE PLAYER ---------- */
    #player {
      --c: #38bdf8;
      --pc: #38bdf8;
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 25;
      width: min(420px, calc(100vw - 24px));
      padding: 10px;
      background: rgba(4, 8, 14, .93);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--c);
      border-radius: 14px;
      box-shadow: 0 0 24px var(--c);
    }
    #player.tall { width: min(300px, calc(100vw - 24px)); }
    #playerHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #playerHead .bb-badge { font-size: 11px; padding: 3px 8px; }
    #playerTitle { flex: 1; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #playerClose { background: transparent; border: none; color: #94a3b8; font-size: 18px; padding: 0 4px; }
    #playerMedia { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
    #player.tall #playerMedia { aspect-ratio: 9 / 16; max-height: 60vh; }
    #player.audio #playerMedia { aspect-ratio: auto; height: 160px; }
    #playerMedia iframe { width: 100%; height: 100%; border: 0; display: block; }
    #playerNote { padding: 18px; font-size: 13px; color: #cbd5e1; text-align: center; line-height: 1.5; }
    #playerFoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: #94a3b8; }
    #playerOpen { color: var(--c); font-weight: 800; text-decoration: none; }
  </style>
</head>

<body>

<div id="webgl"></div>
<div id="css3d"></div>

<div id="reticle" class="dim">
  <div class="fx">
    <div class="aura"></div>
    <div class="ring"></div>
    <div class="flares"><i></i><i></i></div>
    <div class="core"></div>
  </div>
  <div class="label" id="reticleLabel"></div>
</div>

<div id="player" class="hidden">
  <div id="playerHead">
    <span id="playerBadge" class="bb-badge"></span>
    <span id="playerTitle"></span>
    <button id="playerClose" title="Close">✕</button>
  </div>
  <div id="playerMedia"></div>
  <div id="playerFoot">
    <span id="playerHint"></span>
    <a id="playerOpen" href="#" target="_blank" rel="noopener noreferrer">Open ↗</a>
  </div>
</div>

<header id="topbar">
  <div class="brand">OnDaMap</div>
  <button id="postToggle" class="pill primary">+ Post</button>
  <button id="soundBtn" class="pill" title="Sound on/off">🔊</button>
  <button id="accountBtn" class="pill">Sign in</button>
</header>

<div id="postPanel" class="panel hidden">
  <form id="linkForm">
    <input id="title" maxlength="80" placeholder="Billboard title" required>
    <input id="url" placeholder="Paste a YouTube, Spotify, TikTok… link" required autocomplete="off">
    <button type="submit" class="primary" id="postBtn">Launch billboard 🚀</button>
  </form>
  <div id="urlHint" class="hint"></div>
  <div class="hint">🎯 Drag the globe to aim the glowing dot in the middle of the screen. That's where your billboard lands.</div>
  <div id="quota" class="hint"></div>
  <details>
    <summary>Supported sites</summary>
    <div id="siteList"></div>
  </details>
</div>

<div id="authPanel" class="panel hidden">
  <form id="authForm">
    <input id="email" type="email" placeholder="Email" required autocomplete="email">
    <input id="password" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
    <div class="row">
      <button type="submit" class="primary">Sign in</button>
      <button type="button" class="btn" id="signupBtn">Create account</button>
    </div>
  </form>
  <div id="authSigned" class="hidden">
    <div class="row" style="align-items:center">
      <span id="whoami" style="color:#7dd3fc;font-weight:700"></span>
      <button type="button" class="btn" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <div id="authMsg" class="hint">Guests get 1 billboard. Sign in to post up to 100.</div>
</div>

<div id="soundHint">Click anywhere so billboards can play sound 🔊</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ============================================
// 1. CONFIG
// ============================================

const SUPABASE_URL = 'https://nhylzscggsmtuiqvmijs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Nwlnp52KKsSR7hzkWLHEoQ_qrjKPfo8';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const GUEST_LIMIT = 1;
const USER_LIMIT = 100;

const R = 100;              // globe radius
const MIN_DIST = 170;       // closest zoom (further than before = no blurry earth)
const MAX_DIST = 800;
const BB_SCALE = 0.075;     // billboard size in 3D (560px wide -> 42 units, very big)
const LIVE_RANGE = 200;     // how close you must be for a billboard to come alive
const MAX_LIVE = 3;         // how many nearby billboards show live embeds at once

const $ = id => document.getElementById(id);

// ============================================
// 2. ALLOWED SITES
// ============================================

const CAT = { video: '#22d3ee', live: '#fbbf24', social: '#e879f9', music: '#34d399' };

const P = (id, name, domains, cat, color, icon) => ({ id, name, domains, cat, color, icon });

const PLATFORMS = [
  P('ytmusic', 'YouTube Music', ['music.youtube.com'], 'music', '#ff0033', '🎵'),
  P('youtube', 'YouTube', ['youtube.com', 'youtu.be', 'youtube-nocookie.com'], 'video', '#ff0033', '▶️'),
  P('tiktok', 'TikTok', ['tiktok.com'], 'social', '#fe2c55', '🎶'),
  P('instagram', 'Instagram', ['instagram.com'], 'social', '#d62976', '📸'),
  P('facebook', 'Facebook', ['facebook.com', 'fb.watch', 'fb.com'], 'social', '#1877f2', '👍'),
  P('vimeo', 'Vimeo', ['vimeo.com'], 'video', '#1ab7ea', '🎬'),
  P('dailymotion', 'Dailymotion', ['dailymotion.com', 'dai.ly'], 'video', '#0a64ff', '🎬'),
  P('twitch', 'Twitch', ['twitch.tv'], 'live', '#9146ff', '🎮'),
  P('kick', 'Kick', ['kick.com'], 'live', '#2fb10a', '🟢'),
  P('vevo', 'Vevo', ['vevo.com'], 'video', '#ff0a54', '🎤'),
  P('snapchat', 'Snapchat', ['snapchat.com'], 'social', '#e0c800', '👻'),
  P('rumble', 'Rumble', ['rumble.com'], 'video', '#5f9e2a', '📺'),
  P('bilibili', 'Bilibili', ['bilibili.com', 'b23.tv'], 'video', '#00a1d6', '📺'),
  P('reddit', 'Reddit', ['reddit.com', 'redd.it'], 'social', '#ff4500', '👽'),
  P('threads', 'Threads', ['threads.net', 'threads.com'], 'social', '#555555', '🧵'),
  P('pinterest', 'Pinterest', ['pinterest.com', 'pin.it'], 'social', '#e60023', '📌'),
  P('linkedin', 'LinkedIn', ['linkedin.com'], 'social', '#0a66c2', '💼'),
  P('tumblr', 'Tumblr', ['tumblr.com'], 'social', '#36465d', '📝'),
  P('spotify', 'Spotify', ['spotify.com', 'spotify.link'], 'music', '#1db954', '🎧'),
  P('applemusic', 'Apple Music', ['music.apple.com'], 'music', '#fa243c', '🍎'),
  P('amazonmusic', 'Amazon Music', [], 'music', '#1fb2bb', '🎵'),
  P('soundcloud', 'SoundCloud', ['soundcloud.com'], 'music', '#ff5500', '☁️'),
  P('bandcamp', 'Bandcamp', ['bandcamp.com'], 'music', '#1da0c3', '💿'),
  P('tidal', 'TIDAL', ['tidal.com'], 'music', '#0d9da6', '🌊'),
  P('deezer', 'Deezer', ['deezer.com', 'deezer.page.link'], 'music', '#a238ff', '🎶'),
  P('audiomack', 'Audiomack', ['audiomack.com'], 'music', '#e08e00', '🔥'),
  P('pandora', 'Pandora', ['pandora.com'], 'music', '#3668ff', '📻'),
  P('iheart', 'iHeartRadio', ['iheart.com'], 'music', '#c6002b', '❤️'),
  P('mixcloud', 'Mixcloud', ['mixcloud.com'], 'music', '#5000ff', '🎛️'),
  P('beatport', 'Beatport', ['beatport.com'], 'music', '#0a9e63', '🎚️'),
  P('qobuz', 'Qobuz', ['qobuz.com'], 'music', '#4b8bf5', '🎼'),
  P('anghami', 'Anghami', ['anghami.com'], 'music', '#a133ff', '🎵'),
  P('boomplay', 'Boomplay', ['boomplay.com', 'boomplaymusic.com'], 'music', '#1a8cff', '💥'),
  P('jiosaavn', 'JioSaavn', ['jiosaavn.com'], 'music', '#1f9e91', '🎵'),
  P('audius', 'Audius', ['audius.co'], 'music', '#cc0fe0', '🎵'),
];

function normalizeUrl(raw) {
  let s = (raw || '').trim();
  if (!s) return '';
  if (!/^[a-z]+:\/\//i.test(s)) s = 'https://' + s;
  return s.replace(/^http:\/\//i, 'https://');
}

function getPlatform(raw) {
  let u;
  try { u = new URL(normalizeUrl(raw)); } catch { return null; }
  if (u.protocol !== 'https:') return null;
  const host = u.hostname.toLowerCase();
  if (/^music\.amazon\.[a-z.]+$/.test(host)) {
    return { p: PLATFORMS.find(x => x.id === 'amazonmusic'), u };
  }
  for (const p of PLATFORMS) {
    if (p.domains.some(d => host === d || host.endsWith('.' + d))) return { p, u };
  }
  return null;
}

// Turns a normal link into an embeddable player URL (null = show a card instead)
function getEmbed(p, u, autoplay) {
  const a = autoplay ? 1 : 0;
  const path = u.pathname;
  const host = u.hostname.toLowerCase().replace(/^(www|m)\./, '');
  const enc = encodeURIComponent(u.href);
  const parent = location.hostname || 'localhost';
  let m;

  switch (p.id) {
    case 'youtube':
    case 'ytmusic': {
      let id = null;
      if (host === 'youtu.be') id = path.split('/')[1];
      else id = u.searchParams.get('v') ||
        ((path.match(/\/(?:shorts|embed|live|v)\/([\w-]{6,})/) || [])[1]);
      if (!id) return null;
      return {
        src: `https://www.youtube.com/embed/${id}?autoplay=${a}&playsinline=1&rel=0`,
        thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
        tall: /\/shorts\//.test(path)
      };
    }
    case 'tiktok':
      m = path.match(/\/video\/(\d+)/);
      return m ? { src: `https://www.tiktok.com/player/v1/${m[1]}?autoplay=${a}&loop=1&music_info=1&description=1`, tall: true } : null;
    case 'instagram':
      m = path.match(/\/(p|reels?|tv)\/([\w-]+)/);
      return m ? { src: `https://www.instagram.com/${m[1].startsWith('reel') ? 'reel' : m[1]}/${m[2]}/embed/`, tall: true } : null;
    case 'facebook':
      if (host === 'fb.watch' || /\/(videos|reel|watch)/.test(path)) {
        return { src: `https://www.facebook.com/plugins/video.php?href=${enc}&show_text=false&autoplay=${autoplay}`, tall: /\/reel/.test(path) };
      }
      return { src: `https://www.facebook.com/plugins/post.php?href=${enc}&show_text=true`, tall: true };
    case 'vimeo':
      m = path.match(/\/(\d{5,})/);
      return m ? { src: `https://player.vimeo.com/video/${m[1]}?autoplay=${a}` } : null;
    case 'dailymotion':
      m = host === 'dai.ly' ? [0, path.split('/')[1]] : path.match(/\/video\/([\w]+)/);
      return m && m[1] ? {
        src: `https://www.dailymotion.com/embed/video/${m[1]}?autoplay=${a}`,
        thumb: `https://www.dailymotion.com/thumbnail/video/${m[1]}`
      } : null;
    case 'twitch': {
      if (host === 'clips.twitch.tv') {
        const slug = path.split('/')[1];
        return slug ? { src: `https://clips.twitch.tv/embed?clip=${slug}&parent=${parent}&autoplay=${!!autoplay}` } : null;
      }
      if ((m = path.match(/\/clip\/([\w-]+)/))) return { src: `https://clips.twitch.tv/embed?clip=${m[1]}&parent=${parent}&autoplay=${!!autoplay}` };
      if ((m = path.match(/\/videos\/(\d+)/))) return { src: `https://player.twitch.tv/?video=${m[1]}&parent=${parent}&autoplay=${!!autoplay}` };
      const ch = path.split('/')[1];
      return ch ? { src: `https://player.twitch.tv/?channel=${ch}&parent=${parent}&autoplay=${!!autoplay}&muted=false` } : null;
    }
    case 'kick': {
      const ch = path.split('/')[1];
      return ch ? { src: `https://player.kick.com/${ch}?autoplay=${!!autoplay}` } : null;
    }
    case 'rumble':
      m = path.match(/^\/(?:embed\/)?(v[a-z0-9]+)/i);
      return m ? { src: `https://rumble.com/embed/${m[1]}/?autoplay=${autoplay ? 2 : 0}` } : null;
    case 'bilibili':
      m = path.match(/(BV[\w]+)/);
      return m ? { src: `https://player.bilibili.com/player.html?bvid=${m[1]}&autoplay=${a}&high_quality=1` } : null;
    case 'reddit':
      return /\/comments\//.test(path) ? { src: `https://embed.reddit.com${path}?embed=true&theme=dark`, tall: true } : null;
    case 'threads':
      m = path.match(/\/@([\w.]+)\/post\/([\w-]+)/);
      return m ? { src: `https://www.threads.net/@${m[1]}/post/${m[2]}/embed`, tall: true } : null;
    case 'pinterest':
      m = path.match(/\/pin\/(\d+)/);
      return m ? { src: `https://assets.pinterest.com/ext/embed.html?id=${m[1]}`, tall: true } : null;
    case 'linkedin':
      m = u.href.match(/(activity|share|ugcPost)[:-](\d{10,})/);
      return m ? { src: `https://www.linkedin.com/embed/feed/update/urn:li:${m[1]}:${m[2]}`, tall: true } : null;
    case 'spotify': {
      const sp = path.replace(/^\/intl-[a-z-]+/i, '');
      m = sp.match(/^\/(track|album|playlist|episode|show|artist)\/(\w+)/);
      return m ? { src: `https://open.spotify.com/embed/${m[1]}/${m[2]}?theme=0` } : null;
    }
    case 'applemusic':
      return path.length > 1 ? { src: `https://embed.music.apple.com${path}${u.search}` } : null;
    case 'soundcloud':
      return path.length > 1 ? { src: `https://w.soundcloud.com/player/?url=${enc}&auto_play=${!!autoplay}&visual=true&hide_related=true` } : null;
    case 'tidal':
      m = path.match(/\/(track|album|playlist|video)s?\/([\w-]+)/);
      return m ? { src: `https://embed.tidal.com/${m[1]}s/${m[2]}` } : null;
    case 'deezer':
      m = path.match(/\/(track|album|playlist|artist|show|episode)\/(\d+)/);
      return m ? { src: `https://widget.deezer.com/widget/dark/${m[1]}/${m[2]}?autoplay=${!!autoplay}` } : null;
    case 'audiomack':
      m = path.match(/^\/([^/]+)\/(song|album|playlist)\/([^/]+)/);
      return m ? { src: `https://audiomack.com/embed/${m[2]}/${m[1]}/${m[3]}` } : null;
    case 'mixcloud':
      return path.length > 1 ? { src: `https://www.mixcloud.com/widget/iframe/?feed=${encodeURIComponent(path)}&autoplay=${a}` } : null;
    case 'beatport':
      m = path.match(/\/(track|release)\/[^/]+\/(\d+)/);
      return m ? { src: `https://embed.beatport.com/?id=${m[2]}&type=${m[1]}` } : null;
    default:
      return null; // site doesn't allow embedding from a link -> glowing card with Open button
  }
}

function latLngToVec(lat, lng) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -Math.sin(phi) * Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi) * Math.sin(theta)
  );
}

function createCosmicBackground() {
  const palette = ['#ffffff', '#b9dcff', '#a78bfa', '#f0abfc', '#67e8f9', '#fde047']
    .map(c => new THREE.Color(c));

  const count = 9000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 1500 + Math.random() * 2000;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pos[i * 3 + 2] = r * Math.cos(ph);
    const c = palette[(Math.random() * palette.length) | 0];
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 3, vertexColors: true, transparent: true, opacity: 0.95, sizeAttenuation: true, depthWrite: false
  })));

  for (let i = 0; i < 140; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: flareTex, color: palette[(Math.random() * palette.length) | 0],
      transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    const ang = Math.random() * Math.PI * 2;
    const r = 1500 + Math.random() * 800;
    s.position.set(Math.cos(ang) * r, (Math.random() - 0.5) * 2000, Math.sin(ang) * r);
    const size = 8 + Math.random() * 10;
    s.scale.set(size, size, 1);
    s.userData = { phase: Math.random() * 6.28, speed: 0.5 + Math.random() * 2, opacity: 0.6 + Math.random() * 0.4 };
    scene.add(s);
    stars.push(s);
  }

  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const ctx = cv.getContext('2d');
  const gr = ctx.createRadialGradient(256, 256, 5, 256, 256, 250);
  gr.addColorStop(0, 'rgba(100,120,255,0.65)');
  gr.addColorStop(0.3, 'rgba(180,70,255,0.3)');
  gr.addColorStop(0.65, 'rgba(40,180,220,0.15)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 512, 512);
  const nebTex = new THREE.CanvasTexture(cv);
  nebTex.colorSpace = THREE.SRGBColorSpace;
  const nebColors = [0x8877ff, 0x38bdf8, 0xe879f9, 0x22d3ee, 0x818cf8];

  for (let i = 0; i < 14; i++) {
    const gx = new THREE.Sprite(new THREE.SpriteMaterial({
      map: nebTex, color: nebColors[i % nebColors.length], transparent: true,
      opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    const ang = Math.random() * Math.PI * 2;
    const r = 2300 + Math.random() * 600;
    gx.position.set(Math.cos(ang) * r, (Math.random() - 0.5) * 1800, Math.sin(ang) * r);
    const size = 600 + Math.random() * 600;
    gx.scale.set(size, size * 0.7, 1);
    gx.userData.phase = Math.random() * 6.28;
    scene.add(gx);
    galaxies.push(gx);
  }

  shootingStar = new THREE.Group();
  shootingStar.add(new THREE.Mesh(
    new THREE.SphereGeometry(3, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true })
  ));
  shootingLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(-180, 0, 0)]),
    new THREE.LineBasicMaterial({ color: 0x9edfff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })
  );
  shootingStar.add(shootingLine);
  shootingStar.visible = false;
  scene.add(shootingStar);
}

function launchShootingStar() {
  const ang = Math.random() * Math.PI * 2;
  shootingStar.position.set(Math.cos(ang) * 1400, (Math.random() - 0.5) * 900, Math.sin(ang) * 1400);
  shootingVelocity.set(-Math.cos(ang) * 320, -160, -Math.sin(ang) * 320);

  shootingStar.visible = true;
  shootingDuration = 0;
  shootingActive = true;
}

const matCache = {};
function catMats(color) {
  if (!matCache[color]) {
    const c = new THREE.Color(color);
    matCache[color] = {
      core: new THREE.MeshBasicMaterial({ color: c.clone().lerp(new THREE.Color('#ffffff'), 0.55) }),
      glow: new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false }),
      ring: new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }),
      flare: new THREE.SpriteMaterial({ map: flareTex, color: c, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
    };
  }
  return matCache[color];
}

// More likes = taller beam (grows fast at first, then slower, capped)
function poleHeight(votes) {
  return Math.min(150, 18 + 14 * Math.log2(1 + Math.max(0, votes || 0)));
}

const tmpC = new THREE.Vector3();

function blockedByEarth(cam, p) {
  tmpD.copy(p).sub(cam);
  const len = tmpD.length();
  tmpD.divideScalar(len);
  const t = -cam.dot(tmpD);
  if (t < 0 || t > len) return false;
  tmpC.copy(cam).addScaledVector(tmpD, t);
  return tmpC.length() < R * 0.97;
}

class Billboard {
  constructor(row, info) {
    this.row = row;
    this.id = String(row.id);
    this.p = info.p;
    this.u = info.u;
    this.color = CAT[this.p.cat];
    const test = getEmbed(this.p, this.u, false);
    this.canEmbed = !!test;
    this.thumb = test && test.thumb;
    this.tall = !!(test && test.tall);
    this.w = this.tall ? 380 : 560;
    this.h = this.tall ? 700 : 420;

    const lat = Number.isFinite(+row.lat) ? +row.lat : Math.random() * 140 - 70;
    const lng = Number.isFinite(+row.lng) ? +row.lng : Math.random() * 360 - 180;
    this.normal = latLngToVec(lat, lng);

    this.height = 0.01;
    this.targetHeight = poleHeight(row.votes);
    this.state = null;
    this.dist = Infinity;

    this.buildBeam();
    this.buildPanel();
    this.setState('preview');
  }

  buildBeam() {
    const m = catMats(this.color);
    this.group = new THREE.Group();
    this.group.position.copy(this.normal).multiplyScalar(R);
    this.group.quaternion.setFromUnitVectors(UP, this.normal);
    this.core = new THREE.Mesh(CORE_GEO, m.core);
    this.glow = new THREE.Mesh(GLOW_GEO, m.glow);
    this.ring = new THREE.Mesh(RING_GEO, m.ring);
    this.ring.rotation.x = -Math.PI / 2;
    this.ring.position.y = 0.5;
    this.flare = new THREE.Sprite(m.flare);
    this.flare.scale.set(18, 18, 1);
    this.group.add(this.core, this.glow, this.ring, this.flare);
    scene.add(this.group);
  }

  buildPanel() {
    const el = document.createElement('div');
    el.className = 'bb' + (this.tall ? ' tall' : '');
    el.style.setProperty('--c', this.color);
    el.style.setProperty('--pc', this.p.color);

    const head = document.createElement('div');
    head.className = 'bb-head';
    const badge = document.createElement('span');
    badge.className = 'bb-badge';
    badge.textContent = `${this.p.icon} ${this.p.name}`;
    const title = document.createElement('span');
    title.className = 'bb-title';
    title.textContent = this.row.title || 'Untitled';
    head.append(badge, title);

    this.media = document.createElement('div');
    this.media.className = 'bb-media';
    this.media.addEventListener('click', () => {
      if (this.state === 'preview') {
        openPlayer(this);
        flyTo(this);
      }
    });
    this.media.addEventListener('wheel', e => {
      e.preventDefault();
      renderer.domElement.dispatchEvent(new WheelEvent('wheel', e));
    }, { passive: false });

    const foot = document.createElement('div');
    foot.className = 'bb-foot';
    this.likeBtn = document.createElement('button');
    this.likeBtn.className = 'bb-like' + (liked.has(this.id) ? ' liked' : '');
    this.likeBtn.innerHTML = '❤ <b></b>';
    this.likeCount = this.likeBtn.querySelector('b');
    this.likeCount.textContent = this.row.votes || 0;
    this.likeBtn.addEventListener('click', e => { e.stopPropagation(); this.like(); });
    this.status = document.createElement('span');
    this.status.className = 'bb-status';
    const open = document.createElement('a');
    open.className = 'bb-open';
    open.href = this.u.href;
    open.target = '_blank';
    open.rel = 'noopener noreferrer';
    open.textContent = 'Open ↗';
    foot.append(this.likeBtn, this.status, open);

    el.append(head, this.media, foot);
    this.el = el;

    this.css = new CSS3DObject(el);
    el.style.pointerEvents = 'none';
    this.css.scale.setScalar(BB_SCALE);
    cssScene.add(this.css);
  }

  previewNode() {
    const pv = document.createElement('div');
    pv.className = 'pv';
    if (this.thumb) {
      const img = document.createElement('img');
      img.src = this.thumb;
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      const play = document.createElement('div');
      play.className = 'play';
      play.textContent = '▶';
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.textContent = this === pinned ? '▶ Playing in your player' : 'Tap to play here';
      pv.append(img, play, tip);
    } else {
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = this.p.icon;
      const name = document.createElement('div');
      name.className = 'pname';
      name.textContent = this.p.name;
      const t = document.createElement('div');
      t.className = 'ptitle';
      t.textContent = this.row.title || '';
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.textContent = !this.canEmbed ? `Tap Open ↗ to view on ${this.p.name}`
        : this === pinned ? '▶ Playing in your player' : 'Tap to play here';
      pv.append(icon, name, t, tip);
    }
    return pv;
  }

  setState(s) {
    if (this.state === s) return;
    this.state = s;
    this.media.textContent = '';
    this.el.classList.toggle('playing', s === 'playing' && this.canEmbed && soundOn);

    const emb = s === 'preview' ? null : getEmbed(this.p, this.u, s === 'playing' && soundOn);
    if (!emb) {
      this.media.appendChild(this.previewNode());
      this.status.textContent = '';
      return;
    }
    const f = document.createElement('iframe');
    f.src = emb.src;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; clipboard-write; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    this.media.appendChild(f);
    this.status.textContent = s === 'playing' && soundOn ? '🔊 Playing near you' : '👀 Live';
  }

  async like() {
    if (liked.has(this.id)) {
      toast('You already liked this one 💖');
      return;
    }
    liked.add(this.id);
    saveLiked();
    this.likeBtn.classList.add('liked');
    const before = this.row.votes || 0;
    this.setVotes(before + 1);

    const { data, error } = await db.rpc('like_link', { p_id: this.id });
    if (error) {
      console.error(error);
      liked.delete(this.id);
      saveLiked();
      this.likeBtn.classList.remove('liked');
      this.setVotes(before);
      toast('Likes need the one-time setup.sql in Supabase');
      return;
    }
    if (typeof data === 'number') this.setVotes(data);
  }

  setVotes(v) {
    this.row.votes = v;
    this.likeCount.textContent = v;
    this.targetHeight = poleHeight(v);
  }

  update(dt) {
    this.height += (this.targetHeight - this.height) * Math.min(1, dt * 2.5);
    this.core.scale.y = this.glow.scale.y = this.height;
    this.flare.position.y = this.height;

    tmpTop.copy(this.normal).multiplyScalar(R + this.height);
    this.css.position.copy(tmpTop).addScaledVector(camUp, (this.h * BB_SCALE) / 2 + 1);
    this.css.quaternion.copy(camera.quaternion);

    tmpSphere.center.copy(this.css.position);
    tmpSphere.radius = (this.h * BB_SCALE) / 2;
    const visible = frustum.intersectsSphere(tmpSphere) && !blockedByEarth(camera.position, this.css.position);
    this.css.visible = visible;
    this.dist = camera.position.distanceTo(this.css.position);
  }

  dispose() {
    scene.remove(this.group);
    cssScene.remove(this.css);
    this.el.remove();
  }
}

function addBillboard(row) {
  if (!row || row.id == null || billboards.has(String(row.id))) return billboards.get(String(row?.id)) || null;
  const info = getPlatform(row.url || '');
  if (!info) return null; // not an allowed site -> not shown
  const b = new Billboard(row, info);
  billboards.set(b.id, b);
  return b;
}

// The spot on Earth right under the glowing dot in the middle of the screen
function vecToLatLng(v) {
  const n = v.clone().normalize();
  const lat = 90 - Math.acos(THREE.MathUtils.clamp(n.y, -1, 1)) * 180 / Math.PI;
  let lng = Math.atan2(n.z, -n.x) * 180 / Math.PI - 180;
  if (lng < -180) lng += 360;
  return { lat, lng };
}

function reticleSpot() {
  return vecToLatLng(camera.position);
}

function fmtSpot({ lat, lng }) {
  return `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(1)}°${lng >= 0 ? 'E' : 'W'}`;
}

const postPanelOpen = () => !$('postPanel').classList.contains('hidden');

// ============================================
// 7. IN-SITE PLAYER + PROXIMITY AUDIO
// ============================================

let pinned = null;          // billboard playing in the bottom player
let currentPlayer = null;   // billboard auto-playing because you're near it
let soundOn = localStorage.getItem('odm_sound') !== 'off';
let activated = false;

function updateLive() {
  const cands = [...billboards.values()]
    .filter(b => b.css.visible && b.dist < LIVE_RANGE)
    .sort((a, b) => a.dist - b.dist);

  // While the bottom player is open, nothing else auto-plays (no double audio)
  let player = null;
  if (!pinned) {
    const near = cands.filter(b => b.canEmbed);
    player = near[0] || null;
    if (currentPlayer && player !== currentPlayer && near.includes(currentPlayer) &&
        currentPlayer.dist < player.dist * 1.15) {
      player = currentPlayer;
    }
  }

  const live = new Set(cands.filter(b => b !== pinned).slice(0, MAX_LIVE));
  if (player) live.add(player);

  for (const b of billboards.values()) {
    b.setState(b === pinned ? 'preview' : b === player ? 'playing' : live.has(b) ? 'live' : 'preview');
  }
  currentPlayer = player;
}

function refreshPlayer() {
  if (currentPlayer) { currentPlayer.state = null; }
  updateLive();
}

function openPlayer(b) {
  const prev = pinned;
  pinned = b;
  if (prev) prev.state = null;
  b.state = null;
  if (currentPlayer) currentPlayer.state = null;

  const pl = $('player');
  pl.style.setProperty('--c', b.color);
  pl.style.setProperty('--pc', b.p.color);
  pl.classList.remove('hidden');
  pl.classList.toggle('tall', b.tall);
  pl.classList.toggle('audio', b.canEmbed && !b.tall && b.p.cat === 'music' && b.p.id !== 'ytmusic');
  $('playerBadge').textContent = `${b.p.icon} ${b.p.name}`;
  $('playerTitle').textContent = b.row.title || '';
  $('playerOpen').href = b.u.href;

  const media = $('playerMedia');
  media.textContent = '';
  const emb = getEmbed(b.p, b.u, true);
  if (emb) {
    const f = document.createElement('iframe');
    f.src = emb.src;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; clipboard-write; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    media.appendChild(f);
    $('playerHint').textContent = '▶ Playing right here on OnDaMap';
  } else {
    const note = document.createElement('div');
    note.id = 'playerNote';
    note.textContent = `${b.p.name} doesn't let its content play inside other websites, so this one only opens on ${b.p.name}.`;
    media.appendChild(note);
    $('playerHint').textContent = '';
  }
  updateLive();
}

function closePlayer() {
  const prev = pinned;
  pinned = null;
  if (prev) prev.state = null;
  $('player').classList.add('hidden');
  $('playerMedia').textContent = '';
  updateLive();
}

$('playerClose').addEventListener('click', closePlayer);

function onActivate() {
  if (activated) return;
  activated = true;
  $('soundHint')?.remove();
  setTimeout(refreshPlayer, 0);
}
window.addEventListener('pointerup', onActivate, true);
window.addEventListener('keydown', onActivate, true);

function setSoundBtn() { $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }
setSoundBtn();
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('odm_sound', soundOn ? 'on' : 'off');
  setSoundBtn();
  refreshPlayer();
  toast(soundOn ? 'Sound on: billboards play when you fly close' : 'Sound off');
});

setInterval(updateLive, 250);

// ============================================
// 8. CAMERA FLY-TO
// ============================================

let fly = null;

function flyTo(b) {
  const dist = Math.max(MIN_DIST + 5, R + b.targetHeight + (b.tall ? 120 : 80));
  fly = { from: camera.position.clone(), to: b.normal.clone().multiplyScalar(Math.min(dist, MAX_DIST)), t: 0, dur: 1.6 };
  controls.autoRotate = false;
  lastInteract = performance.now();
}

const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function stepFly(dt) {
  fly.t = Math.min(1, fly.t + dt / fly.dur);
  const k = ease(fly.t);
  const a = fly.from.clone().normalize();
  const bdir = fly.to.clone().normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(a, bdir);
  const qk = new THREE.Quaternion().slerp(q, k);
  const len = THREE.MathUtils.lerp(fly.from.length(), fly.to.length(), k);
  camera.position.copy(a.applyQuaternion(qk).multiplyScalar(len));
  camera.lookAt(0, 0, 0);
  if (fly.t >= 1) {
    fly = null;
    controls.update();
  }
}

// ============================================
// 9. ANIMATION LOOP
// ============================================

let lastTime = 0;
let frame = 0;

function animate(ts) {
  requestAnimationFrame(animate);
  const dt = Math.min((ts - lastTime) / 1000 || 0, 0.05);
  lastTime = ts;
  const time = ts * 0.001;

  if (fly) {
    stepFly(dt);
  } else {
    const d = camera.position.length();
    controls.rotateSpeed = 0.15 + 0.85 * THREE.MathUtils.clamp((d - MIN_DIST) / (MAX_DIST - MIN_DIST), 0, 1);
    const busy = currentPlayer || pinned || postPanelOpen();
    if (!controls.autoRotate && !busy && performance.now() - lastInteract > 25000) {
      controls.autoRotate = true;
    }
    if (busy) controls.autoRotate = false;
    controls.update();
  }

  // reticle: bright while posting, faint otherwise
  const posting = postPanelOpen();
  $('reticle').classList.toggle('dim', !posting);
  if (posting && frame++ % 6 === 0) {
    $('reticleLabel').textContent = '📍 Your billboard lands here · ' + fmtSpot(reticleSpot());
  }

  camera.updateMatrixWorld();
  camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  projM.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projM);

  for (const b of billboards.values()) b.update(dt);

  // beam shimmer
  const shimmer = 0.22 + 0.1 * Math.sin(time * 3);
  for (const k in matCache) matCache[k].glow.opacity = shimmer;

  if (clouds) clouds.rotation.y += 0.00015;

  for (const s of stars) {
    const br = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.userData.speed + s.userData.phase));
    s.material.opacity = s.userData.opacity * br;
  }
  for (const g of galaxies) g.material.opacity = 0.25 + 0.08 * Math.sin(time * 0.35 + g.userData.phase);

  if (!shootingActive) {
    shootingTimer -= dt;
    if (shootingTimer <= 0) launchShootingStar();
  } else {
    shootingDuration += dt;
    shootingStar.position.addScaledVector(shootingVelocity, dt);
    const fade = Math.max(0, 1 - shootingDuration / 1.3);
    shootingLine.material.opacity = fade * 0.9;
    shootingStar.children[0].material.opacity = fade;
    if (shootingDuration > 1.3) {
      shootingStar.visible = false;
      shootingActive = false;
      shootingTimer = 4 + Math.random() * 9;
    }
  }

  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
});

// ============================================
// 10. UI: PANELS, TOAST
// ============================================

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function openPanel(id) {
  const target = $(id);
  const wasOpen = !target.classList.contains('hidden');
  $('postPanel').classList.add('hidden');
  $('authPanel').classList.add('hidden');
  if (!wasOpen) target.classList.remove('hidden');
}

$('postToggle').addEventListener('click', () => {
  openPanel('postPanel');
  refreshQuota();
  if (postPanelOpen()) {
    controls.autoRotate = false;
    $('reticleLabel').textContent = '📍 Your billboard lands here · ' + fmtSpot(reticleSpot());
    toast('Drag the globe to aim the glowing dot 🎯');
  }
});
$('accountBtn').addEventListener('click', () => openPanel('authPanel'));
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('postPanel').classList.add('hidden');
    $('authPanel').classList.add('hidden');
  }
});

$('url').addEventListener('input', () => {
  const hint = $('urlHint');
  const v = $('url').value.trim();
  if (!v) { hint.textContent = ''; hint.className = 'hint'; return; }
  const info = getPlatform(v);
  if (!info) {
    hint.textContent = '✗ That site isn’t supported. Open “Supported sites” below.';
    hint.className = 'hint bad';
    return;
  }
  const emb = getEmbed(info.p, info.u, false);
  hint.textContent = emb
    ? `✓ ${info.p.name}: plays right on the globe`
    : `✓ ${info.p.name}: shows as a glowing card with an Open button (this link can’t be embedded)`;
  hint.className = 'hint ok';
});

// ============================================
// 11. AUTH
// ============================================

let currentUser = null;

function setUser(session) {
  currentUser = session?.user || null;
  const name = currentUser ? (currentUser.email?.split('@')[0] || 'Signed in') : null;
  $('accountBtn').textContent = name || 'Sign in';
  $('authForm').classList.toggle('hidden', !!currentUser);
  $('authSigned').classList.toggle('hidden', !currentUser);
  $('whoami').textContent = name || '';
  $('authMsg').textContent = currentUser
    ? `You can post up to ${USER_LIMIT} billboards.`
    : `Guests get ${GUEST_LIMIT} billboard. Sign in to post up to ${USER_LIMIT}.`;
  refreshQuota();
}

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('authMsg').textContent = 'Signing in…';
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) {
    $('authMsg').textContent = error.message + '. New here? Tap “Create account”.';
  } else {
    $('authPanel').classList.add('hidden');
    toast('Signed in! You can post up to 100 billboards.');
  }
});

$('signupBtn').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || password.length < 6) {
    $('authMsg').textContent = 'Enter an email and a password with 6+ characters.';
    return;
  }
  $('authMsg').textContent = 'Creating account…';
  const { data, error } = await db.auth.signUp({ email, password });
  if (error) $('authMsg').textContent = error.message;
  else if (!data.session) $('authMsg').textContent = 'Account created! Check your email to confirm, then sign in.';
  else { $('authPanel').classList.add('hidden'); toast('Account created and signed in!'); }
});

$('signOutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  toast('Signed out');
});

const guestCount = () => +(localStorage.getItem('odm_guest_posts') || (localStorage.getItem('guest_posted') ? 1 : 0));

async function myCount() {
  const { count, error } = await db.from('links').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
  if (error) throw error;
  return count || 0;
}

async function refreshQuota() {
  const q = $('quota');
  if (!currentUser) {
    q.textContent = `Guest: ${Math.min(guestCount(), GUEST_LIMIT)} / ${GUEST_LIMIT} free billboard used. Sign in for ${USER_LIMIT}.`;
    return;
  }
  try { q.textContent = `${await myCount()} / ${USER_LIMIT} billboards used`; }
  catch { q.textContent = ''; }
}

// ============================================
// 12. POSTING
// ============================================

$('linkForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('title').value.trim().slice(0, 80);
  const info = getPlatform($('url').value);
  if (!title) return;
  if (!info) { toast('Only links from the supported sites can be posted.'); return; }

  const btn = $('postBtn');
  btn.disabled = true;

  try {
    if (currentUser) {
      if ((await myCount()) >= USER_LIMIT) { toast(`You’ve reached the limit of ${USER_LIMIT} billboards.`); return; }
    } else if (guestCount() >= GUEST_LIMIT) {
      toast('Guests get 1 free billboard. Sign in to post up to 100!');
      openPanel('authPanel');
      return;
    }

    const { lat, lng } = reticleSpot();
    const { data, error } = await db.from('links')
      .insert([{ title, url: info.u.href, lat, lng, votes: 0, user_id: currentUser ? currentUser.id : null }])
      .select()
      .single();

    if (error) { toast('Error posting: ' + error.message); return; }

    if (!currentUser) localStorage.setItem('odm_guest_posts', String(guestCount() + 1));
    e.target.reset();
    $('urlHint').textContent = '';
    $('postPanel').classList.add('hidden');

    const b = addBillboard(data);
    if (b) flyTo(b);
    toast('Your billboard is up! 🚀');
    refreshQuota();
  } catch (err) {
    console.error(err);
    toast('Something went wrong, try again.');
  } finally {
    btn.disabled = false;
  }
});

// ============================================
// 13. LOAD + LIVE UPDATES
// ============================================

async function loadLinks() {
  const { data, error } = await db.from('links').select('*').order('votes', { ascending: false }).limit(1500);
  if (error) {
    console.error('Link loading error:', error);
    toast('Couldn’t load billboards.');
    return;
  }
  (data || []).forEach(addBillboard);
}

function subscribeLive() {
  try {
    db.channel('links-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'links' }, payload => {
        if (payload.eventType === 'INSERT') addBillboard(payload.new);
        else if (payload.eventType === 'UPDATE') {
          const b = billboards.get(String(payload.new.id));
          if (b) b.setVotes(payload.new.votes || 0);
        } else if (payload.eventType === 'DELETE') {
          const id = String(payload.old?.id);
          const b = billboards.get(id);
          if (b) { if (b === currentPlayer) currentPlayer = null; if (b === pinned) closePlayer(); b.dispose(); billboards.delete(id); }
        }
      })
      .subscribe();
  } catch (err) {
    console.warn('Realtime unavailable', err);
  }
}

async function init() {
  const { data } = await db.auth.getSession();
  setUser(data?.session);
  db.auth.onAuthStateChange((_e, session) => setUser(session));
  await loadLinks();
  subscribeLive();
  setTimeout(() => toast('Drag to spin · zoom in close to a billboard to watch & hear it 🔊'), 800);
}

init();
</script>
