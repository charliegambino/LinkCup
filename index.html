<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkCup — 24h Links</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 16px; background: #0f172a; color: #f8fafc; }
    h1 { margin-bottom: 4px; }
    .sub { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    form { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
    input { flex: 1; min-width: 180px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    .card { display: flex; align-items: center; gap: 14px; background: #1e293b; padding: 14px; border-radius: 8px; margin-bottom: 10px; }
    .votes { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
    .votes button { background: transparent; color: #94a3b8; padding: 2px 6px; font-size: 16px; }
    .votes button:hover { color: #38bdf8; }
    .link-info a { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 16px; }
    .link-info a:hover { text-decoration: underline; }
    .meta { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>LinkCup</h1>
  <div class="sub">Links disappear after 24 hours.</div>

  <form id="linkForm">
    <input type="text" id="title" placeholder="Link title" required />
    <input type="url" id="url" placeholder="https://example.com" required />
    <button type="submit">Post</button>
  </form>

  <div id="feed">Loading links...</div>

  <script>
    const SUPABASE_URL = 'https://nhylzscggsmtuiqvmijs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Nwlnp52KKsSR7hzkWLHEoQ_qrjKPfo8';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadLinks() {
      const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const { data, error } = await db
        .from('links')
        .select('*')
        .gte('created_at', yesterday)
        .order('votes', { ascending: false });

      const feed = document.getElementById('feed');
      if (error) { feed.innerText = 'Error loading links.'; return; }
      if (!data.length) { feed.innerText = 'No links in the last 24 hours. Post one!'; return; }

      feed.innerHTML = data.map(item => `
        <div class="card">
          <div class="votes">
            <button onclick="vote(${item.id}, ${item.votes + 1})">▲</button>
            <span>${item.votes}</span>
            <button onclick="vote(${item.id}, ${item.votes - 1})">▼</button>
          </div>
          <div class="link-info">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            <div class="meta">${new URL(item.url).hostname}</div>
          </div>
        </div>
      `).join('');
    }

    async function vote(id, newVotes) {
      await db.from('links').update({ votes: newVotes }).eq('id', id);
      loadLinks();
    }

    document.getElementById('linkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const url = document.getElementById('url').value;
      await db.from('links').insert([{ title, url, votes: 1 }]);
      e.target.reset();
      loadLinks();
    });

    loadLinks();
  </script>
</body>
</html>
