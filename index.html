
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnDaMap — 3D Globe Links</title>

  <!-- PINNED LIBRARY VERSIONS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #010204;
      color: white;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #globeViz {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: calc(100% - 40px);
      max-width: 408px;
      background: rgba(4, 8, 12, 0.9);
      backdrop-filter: blur(12px);
      padding: 22px;
      border-radius: 15px;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56,189,248,.25);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg,#38bdf8,#10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      background: #070d14;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #38bdf8; }

    button {
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg,#0284c7,#10b981);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { opacity: .9; }

    .auth-bar {
      margin-top: 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
    }

    .auth-bar button {
      padding: 5px 10px;
      font-size: 11px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    #modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 90%;
      max-width: 600px;
      background: #050a0f;
      border: 1px solid #38bdf8;
      border-radius: 14px;
      z-index: 100;
      padding: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,.9);
    }

    #modal iframe {
      width: 100%;
      height: 315px;
      border-radius: 8px;
      border: none;
      margin-top: 12px;
    }

    .close-btn {
      float: right;
      background: transparent;
      color: #94a3b8;
      font-size: 18px;
      padding: 0;
    }

    @media(max-width:500px) {
      .ui-overlay {
        top: 12px;
        left: 12px;
        width: calc(100% - 24px);
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<div id="globeViz"></div>

<div class="ui-overlay">

  <h1>OnDaMap</h1>

  <div class="sub">
    Magical 3D globe of internet shares.
    Guests get 1 free post; sign in for up to 10!
  </div>

  <form id="linkForm">
    <input type="text" id="title" placeholder="Link title" required>
    <input type="url" id="url" placeholder="https://youtube.com/... or any URL" required>
    <button type="submit">Post to Globe</button>
  </form>

  <div class="auth-bar">
    <span id="userStatus">Guest Mode</span>
    <button id="authBtn" onclick="toggleAuth()">Sign In</button>
  </div>

</div>

<div id="modal">
  <button class="close-btn" onclick="closeModal()">✕</button>
  <h2 id="modalTitle" style="color:#38bdf8;font-size:18px"></h2>
  <div id="modalContent"></div>
  <a id="modalLink" href="#" target="_blank"
     rel="noopener noreferrer"
     style="display:inline-block;margin-top:12px;color:#10b981;font-weight:600;text-decoration:none">
    Open Full Link ↗
  </a>
</div>

<script>

// ============================================
// 1. SUPABASE
// ============================================

const SUPABASE_URL =
  'https://nhylzscggsmtuiqvmijs.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_Nwlnp52KKsSR7hzkWLHEoQ_qrjKPfo8';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let globe;
let currentUser = null;
let cloudsMesh = null;

let stars = [];
let galaxies = [];
let shootingStar;
let shootingLine;

let shootingActive = false;
let shootingTimer = 0;
let shootingDuration = 0;

let shootingVelocity = new THREE.Vector3();


// ============================================
// 2. INITIALIZATION
// ============================================

async function init() {

  try {

    const { data, error } = await db.auth.getSession();

    if (error) console.error(error);

    updateAuthUI(data?.session);

    db.auth.onAuthStateChange((event, session) => {
      updateAuthUI(session);
    });

    setupGlobe();

    // Load links after globe initialization.
    await loadGlobeLinks();

  } catch (error) {

    console.error('Initialization error:', error);

  }

}


// ============================================
// 3. AUTHENTICATION
// ============================================

function updateAuthUI(session) {

  currentUser = session?.user || null;

  const status = document.getElementById('userStatus');
  const btn = document.getElementById('authBtn');

  if (currentUser) {

    status.innerText =
      currentUser.email?.split('@')[0] || 'Signed In';

    btn.innerText = 'Sign Out';

  } else {

    status.innerText = 'Guest Mode';
    btn.innerText = 'Sign In';

  }

}


async function toggleAuth() {

  if (currentUser) {

    await db.auth.signOut();

    return;

  }

  const email = prompt('Enter your email:');
  if (!email) return;

  const password = prompt('Enter your password:');
  if (!password) return;

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {

    const { error: signupError } = await db.auth.signUp({
      email,
      password
    });

    if (signupError) {

      alert(signupError.message);

    } else {

      alert('Account created! Check your email if confirmation is required.');

    }

  }

}


// ============================================
// 4. COSMIC BACKGROUND
// ============================================

function createCosmicBackground(scene) {

  // STARFIELD

  const count = 10000;

  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  const palette = [
    '#ffffff',
    '#b9dcff',
    '#a78bfa',
    '#f0abfc',
    '#67e8f9',
    '#fde047'
  ].map(color => new THREE.Color(color));

  for (let i = 0; i < count; i++) {

    const radius = 850 + Math.random() * 1200;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    positions[i * 3] =
      radius * Math.sin(phi) * Math.cos(theta);

    positions[i * 3 + 1] =
      radius * Math.sin(phi) * Math.sin(theta);

    positions[i * 3 + 2] =
      radius * Math.cos(phi);

    const color =
      palette[Math.floor(Math.random() * palette.length)];

    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;

  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions, 3)
  );

  geometry.setAttribute(
    'color',
    new THREE.BufferAttribute(colors, 3)
  );

  const starMaterial = new THREE.PointsMaterial({
    size: 1.7,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    sizeAttenuation: true
  });

  const starField = new THREE.Points(
    geometry,
    starMaterial
  );

  scene.add(starField);


  // INDIVIDUAL TWINKLING STARS

  for (let i = 0; i < 140; i++) {

    const material = new THREE.SpriteMaterial({
      color: palette[
        Math.floor(Math.random() * palette.length)
      ],
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const star = new THREE.Sprite(material);

    const angle = Math.random() * Math.PI * 2;
    const radius = 850 + Math.random() * 500;

    star.position.set(
      Math.cos(angle) * radius,
      (Math.random() - 0.5) * 1200,
      Math.sin(angle) * radius
    );

    const size = 2 + Math.random() * 3;

    star.scale.set(size, size, 1);

    star.userData.phase = Math.random() * 6.28;
    star.userData.speed = 0.5 + Math.random() * 2;
    star.userData.opacity = 0.6 + Math.random() * 0.4;

    scene.add(star);
    stars.push(star);

  }


  // COLORFUL GALAXY NEBULAE

  const canvas = document.createElement('canvas');

  canvas.width = 512;
  canvas.height = 512;

  const ctx = canvas.getContext('2d');

  const gradient = ctx.createRadialGradient(
    256, 256, 5,
    256, 256, 250
  );

  gradient.addColorStop(0, 'rgba(100,120,255,0.65)');
  gradient.addColorStop(0.3, 'rgba(180,70,255,0.3)');
  gradient.addColorStop(0.65, 'rgba(40,180,220,0.15)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 512);

  const nebulaTexture = new THREE.CanvasTexture(canvas);

  const nebulaColors = [
    0x8877ff,
    0x38bdf8,
    0xe879f9,
    0x22d3ee,
    0x818cf8
  ];

  for (let i = 0; i < 14; i++) {

    const galaxy = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: nebulaTexture,
        color: nebulaColors[i % nebulaColors.length],
        transparent: true,
        opacity: 0.3,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );

    const angle = Math.random() * Math.PI * 2;
    const radius = 1150 + Math.random() * 400;

    galaxy.position.set(
      Math.cos(angle) * radius,
      (Math.random() - 0.5) * 1000,
      Math.sin(angle) * radius
    );

    const size = 300 + Math.random() * 300;

    galaxy.scale.set(size, size * 0.7, 1);

    galaxy.userData.phase = Math.random() * 6.28;

    scene.add(galaxy);
    galaxies.push(galaxy);

  }


  // SHOOTING STAR

  shootingStar = new THREE.Group();

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(2, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );

  shootingStar.add(head);

  const lineGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(-100, 0, 0)
  ]);

  shootingLine = new THREE.Line(
    lineGeometry,
    new THREE.LineBasicMaterial({
      color: 0x9edfff,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    })
  );

  shootingStar.add(shootingLine);
  shootingStar.visible = false;

  scene.add(shootingStar);


  // LIGHTING

  const sunlight = new THREE.DirectionalLight(
    0xfff5e6,
    2
  );

  sunlight.position.set(400, 200, 400);
  scene.add(sunlight);

  const ambient = new THREE.AmbientLight(
    0x334155,
    1.15
  );

  scene.add(ambient);

}


// ============================================
// 5. SHOOTING STARS
// ============================================

function launchShootingStar() {

  const angle = Math.random() * Math.PI * 2;

  shootingStar.position.set(
    Math.cos(angle) * 900,
    (Math.random() - 0.5) * 700,
    Math.sin(angle) * 900
  );

  shootingVelocity.set(
    -Math.cos(angle) * 170,
    -90,
    -Math.sin(angle) * 170
  );

  shootingStar.quaternion.setFromUnitVectors(
    new THREE.Vector3(1, 0, 0),
    shootingVelocity.clone().normalize()
  );

  shootingStar.visible = true;

  shootingDuration = 0;
  shootingActive = true;

}


// ============================================
// 6. ANIMATION LOOP
// ============================================

let lastTime = 0;

function animate(timestamp) {

  requestAnimationFrame(animate);

  const delta = Math.min(
    (timestamp - lastTime) / 1000 || 0,
    0.05
  );

  lastTime = timestamp;

  const time = timestamp * 0.001;


  // CLOUD MOVEMENT

  if (cloudsMesh) {

    cloudsMesh.rotation.y += 0.00015;

  }


  // STAR TWINKLING

  stars.forEach(star => {

    const brightness =
      0.35 + 0.65 *
      (0.5 + 0.5 * Math.sin(
        time * star.userData.speed +
        star.userData.phase
      ));

    star.material.opacity =
      star.userData.opacity * brightness;

  });


  // GALAXY PULSATION

  galaxies.forEach(galaxy => {

    galaxy.material.opacity =
      0.25 + 0.08 *
      Math.sin(time * 0.35 + galaxy.userData.phase);

  });


  // SHOOTING STARS

  if (!shootingActive) {

    shootingTimer -= delta;

    if (shootingTimer <= 0) {

      launchShootingStar();

    }

  } else {

    shootingDuration += delta;

    shootingStar.position.addScaledVector(
      shootingVelocity,
      delta
    );

    const fade = Math.max(
      0,
      1 - shootingDuration / 1.3
    );

    shootingLine.material.opacity = fade * 0.9;
    shootingStar.children[0].material.opacity = fade;

    if (shootingDuration > 1.3) {

      shootingStar.visible = false;
      shootingActive = false;

      shootingTimer = 4 + Math.random() * 9;

    }

  }

}


// ============================================
// 7. GLOBE SETUP
// ============================================

function setupGlobe() {

  const container =
    document.getElementById('globeViz');

  const rendererConfig = {
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  };


  // START WITH THE ORIGINAL WORKING EARTH TEXTURE

  globe = Globe({ rendererConfig })(container)

    .globeImageUrl(
      'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
    )

    .bumpImageUrl(
      'https://unpkg.com/three-globe/example/img/earth-topology.png'
    )

    .backgroundColor('#010204')

    .atmosphereColor('#38bdf8')

    .atmosphereAltitude(0.3)

    .htmlElementsData([])

    .htmlElement(d => {

      const el = document.createElement('div');

      const size = Math.max(
        10,
        (d.votes || 1) * 2.2
      );

      el.innerHTML = `
        <div style="
          cursor:pointer;
          width:${size}px;
          height:${size}px;
          border-radius:50%;
          background:radial-gradient(circle,#38bdf8,#10b981);
          box-shadow:0 0 16px #38bdf8,0 0 26px #10b981;
          border:2px solid white;
        "></div>
      `;

      el.onclick = () => openPreview(d);

      return el;

    });


  // RENDERING QUALITY

  const renderer = globe.renderer();

  const pixelRatio = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  renderer.setPixelRatio(pixelRatio);


  // GLOBE MATERIAL

  const earthMaterial = globe.globeMaterial();

  earthMaterial.bumpScale = 12;
  earthMaterial.shininess = 35;


  // LOAD 8K TEXTURE SEPARATELY.
  // THE ORIGINAL TEXTURE REMAINS VISIBLE IF THIS FAILS.

  const textureLoader = new THREE.TextureLoader();

  textureLoader.load(

    'https://www.solarsystemscope.com/textures/download/8k_earth_daymap.jpg',

    function(texture) {

      console.log('8K Earth texture loaded successfully.');

      texture.anisotropy =
        renderer.capabilities.getMaxAnisotropy();

      texture.minFilter =
        THREE.LinearMipmapLinearFilter;

      texture.magFilter =
        THREE.LinearFilter;

      texture.encoding = THREE.sRGBEncoding;

      texture.generateMipmaps = true;

      texture.needsUpdate = true;

      earthMaterial.map = texture;

      earthMaterial.needsUpdate = true;

    },

    undefined,

    function(error) {

      console.warn(
        '8K texture unavailable. Keeping original Earth texture.',
        error
      );

    }

  );


  // CAMERA AND ZOOM

  globe.controls().autoRotate = true;

  globe.controls().autoRotateSpeed = 0.4;

  globe.controls().minDistance = 110;

  globe.controls().maxDistance = 700;

  globe.controls().enableDamping = true;

  globe.controls().dampingFactor = 0.06;


  // COSMIC BACKGROUND

  createCosmicBackground(globe.scene());


  // CLOUD LAYER

  textureLoader.load(

    'https://unpkg.com/three-globe/example/img/earth-clouds.png',

    function(texture) {

      const geometry = new THREE.SphereGeometry(
        globe.getGlobeRadius() + 1.5,
        100,
        100
      );

      const material = new THREE.MeshPhongMaterial({

        map: texture,

        transparent: true,

        opacity: 0.3,

        depthWrite: false

      });

      cloudsMesh = new THREE.Mesh(
        geometry,
        material
      );

      globe.scene().add(cloudsMesh);

    },

    undefined,

    function(error) {

      console.warn('Cloud texture unavailable:', error);

    }

  );


  // RESIZE SUPPORT

  window.addEventListener('resize', () => {

    globe.width(window.innerWidth);
    globe.height(window.innerHeight);

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

  });


  // START ANIMATION

  requestAnimationFrame(animate);

}


// ============================================
// 8. LOAD DATABASE LINKS
// ============================================

async function loadGlobeLinks() {

  const { data, error } = await db
    .from('links')
    .select('*');

  if (error) {

    console.error('Link loading error:', error);

    return;

  }

  if (!data || !globe) return;

  globe.htmlElementsData(data);

}


// ============================================
// 9. POST LINKS
// ============================================

document.getElementById('linkForm')
  .addEventListener('submit', async function(e) {

    e.preventDefault();

    const title =
      document.getElementById('title').value.trim();

    const url =
      document.getElementById('url').value.trim();


    // ACCOUNT LIMIT

    if (currentUser) {

      const { count, error } = await db
        .from('links')
        .select('*', {
          count: 'exact',
          head: true
        })
        .eq('user_id', currentUser.id);

      if (error) {

        alert(error.message);
        return;

      }

      if (count >= 10) {

        alert(
          'You have reached the limit of 10 posted links per account!'
        );

        return;

      }

    } else {

      if (localStorage.getItem('guest_posted')) {

        alert(
          'Guests can make 1 free post! Sign in to post more links.'
        );

        return;

      }

    }


    // RANDOM LOCATION

    const lat = Math.random() * 140 - 70;
    const lng = Math.random() * 360 - 180;


    // SAVE TO SUPABASE

    const { error } = await db
      .from('links')
      .insert([{

        title,
        url,
        lat,
        lng,
        votes: 1,

        user_id: currentUser
          ? currentUser.id
          : null

      }]);


    if (error) {

      alert('Error posting link: ' + error.message);

    } else {

      if (!currentUser) {

        localStorage.setItem('guest_posted', 'true');

        alert(
          'Guest post successful! Sign in to unlock up to 10 posts.'
        );

      } else {

        alert('Successfully pinned to the globe!');

      }

      e.target.reset();

      await loadGlobeLinks();

    }

  });


// ============================================
// 10. LINK PREVIEW
// ============================================

function openPreview(item) {

  document.getElementById('modalTitle').innerText =
    item.title;

  document.getElementById('modalLink').href =
    item.url;

  const content =
    document.getElementById('modalContent');

  content.innerHTML = '';


  // YOUTUBE

  if (
    item.url.includes('youtube.com') ||
    item.url.includes('youtu.be')
  ) {

    let videoId = null;

    try {

      const parsed = new URL(item.url);

      if (parsed.hostname.includes('youtu.be')) {

        videoId = parsed.pathname.split('/').filter(Boolean)[0];

      } else {

        videoId = parsed.searchParams.get('v');

      }

    } catch (error) {

      console.error(error);

    }

    if (videoId) {

      const iframe = document.createElement('iframe');

      iframe.src =
        'https://www.youtube.com/embed/' +
        encodeURIComponent(videoId);

      iframe.allowFullscreen = true;

      iframe.allow =
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';

      content.appendChild(iframe);

    }

  }


  // SPOTIFY

  else if (item.url.includes('spotify.com')) {

    const iframe = document.createElement('iframe');

    iframe.src = item.url.replace(
      'open.spotify.com',
      'open.spotify.com/embed'
    );

    iframe.height = 152;

    iframe.allow = 'encrypted-media';

    content.appendChild(iframe);

  }


  // OTHER LINKS

  else {

    const message = document.createElement('p');

    message.style.color = '#94a3b8';

    message.innerText =
      'Direct preview not available. Click below to view!';

    content.appendChild(message);

  }

  document.getElementById('modal').style.display = 'block';

}


// ============================================
// 11. CLOSE MODAL
// ============================================

function closeModal() {

  document.getElementById('modal').style.display = 'none';

  document.getElementById('modalContent').innerHTML = '';

}


// ============================================
// 12. START
// ============================================

init();

</script>

</body>
</html>
